flde-salazzle-schlimazel.mp3:
  title: Salazzle Schlimazel
  url: https://youtu.be/LMFQX2NnLLc
  artist:
    name: &FLDE "F\u039BDE"
    url: https://youtube.com/@FLDE
  comments: |
    This was the song stuck in my head on maybe the worst day of my work life.
    Caked in ice cream trying to get through customers in cone line with a
    manager that wouldn't stop nagging me for every little mistake I made until
    they deemed it fit to "fire" me. And... Uh... Not tell anyone that I was
    fired but me. For some reason.

    I'm very fond of the chording of this song combined with the snazzy drums.
    I wish so badly the threshold for a conventional song were even just a bit
    lower, I'd be playing this all the time.
