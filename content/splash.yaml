      splashes:
        - '<turn it="up!">'                          # HTML
        - '_Oh yeah,_ **party!**'                    # Markdown
        - 'drop { the: beat! }'                      # CSS
        - 'make().some["noise!"]'                    # JavaScript
        - '{"get":"funky!"}'                         # JSON
        - 'if movin then get:Groovin("!") end'       # Lua

    - group: Software
      splashes:
